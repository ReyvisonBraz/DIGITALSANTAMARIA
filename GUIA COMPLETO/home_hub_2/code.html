<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guia Cidadão - Home Hub</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&amp;family=Zilla+Slab:wght@700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2563eb", // blue-600
              "primary-dark": "#1e40af", // blue-800
              "background-light": "#f8fafc", // slate-50
              "background-dark": "#0f172a", // slate-900
              "surface": "#F1F5F9", // slate-100
              "surface-active": "#E2E8F0", // slate-200
              "text-main": "#0F172A", // slate-900
              "accent-danger": "#dc2626", // red-600
            },
            fontFamily: {
              "display": ["Public Sans", "sans-serif"],
              "heading": ["Zilla Slab", "serif"],
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        body {
            min-height: 100dvh;
            padding-top: 64px; /* TopAppBar height */
            padding-bottom: 64px; /* BottomNavBar height */
        }
    </style>
</head>
<body class="bg-slate-50 font-display text-text-main antialiased flex flex-col">
<!-- TopAppBar Component -->
<header class="fixed top-0 w-full z-50 h-16 bg-blue-600 dark:bg-blue-900 border-b-2 border-blue-800 dark:border-blue-700 shadow-md">
<div class="flex items-center justify-between px-4 max-w-md mx-auto w-full h-full">
<button class="text-white transition-all duration-200 active:scale-95 hover:bg-blue-700 dark:hover:bg-blue-800 p-2 rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="text-white font-sans font-bold tracking-tight uppercase text-lg">Guia Cidadão</h1>
<div class="w-10 h-10 rounded-full bg-blue-500 border-2 border-white/20 flex items-center justify-center overflow-hidden transition-all duration-200 active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-white text-xl">person</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto">
<!-- Alert Banner -->
<div class="bg-red-600 text-white w-full min-h-[48px] px-4 py-3 flex items-center gap-3 shrink-0">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="font-display font-bold text-base leading-tight">Alerta de Chuvas Fortes</p>
</div>
<!-- Service Grid -->
<div class="p-4 grid grid-cols-2 gap-4 flex-1 content-start mt-2">
<!-- Card 1: Empregos & Serviços -->
<button class="flex flex-col items-center justify-center gap-3 bg-white dark:bg-slate-800 rounded-lg p-4 min-h-[140px] w-full border-b-4 border-blue-600 shadow-sm transition-all duration-200 hover:bg-slate-50 hover:translate-y-[-2px] active:scale-95 text-center group">
<span class="material-symbols-outlined text-blue-600 text-[36px] group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">work</span>
<h2 class="font-sans font-bold text-sm uppercase tracking-tight text-slate-900 dark:text-white leading-tight">Empregos &amp;<br/>Serviços</h2>
</button>
<!-- Card 2: Comércio Local -->
<button class="flex flex-col items-center justify-center gap-3 bg-white dark:bg-slate-800 rounded-lg p-4 min-h-[140px] w-full border-b-4 border-blue-600 shadow-sm transition-all duration-200 hover:bg-slate-50 hover:translate-y-[-2px] active:scale-95 text-center group">
<span class="material-symbols-outlined text-blue-600 text-[36px] group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">storefront</span>
<h2 class="font-sans font-bold text-sm uppercase tracking-tight text-slate-900 dark:text-white leading-tight">Comércio<br/>Local</h2>
</button>
<!-- Card 3: Comunidade -->
<button class="flex flex-col items-center justify-center gap-3 bg-white dark:bg-slate-800 rounded-lg p-4 min-h-[140px] w-full border-b-4 border-blue-600 shadow-sm transition-all duration-200 hover:bg-slate-50 hover:translate-y-[-2px] active:scale-95 text-center group">
<span class="material-symbols-outlined text-blue-600 text-[36px] group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">chat</span>
<h2 class="font-sans font-bold text-sm uppercase tracking-tight text-slate-900 dark:text-white leading-tight">Comunidade</h2>
</button>
<!-- Card 4: Saúde Fácil -->
<button class="flex flex-col items-center justify-center gap-3 bg-white dark:bg-slate-800 rounded-lg p-4 min-h-[140px] w-full border-b-4 border-blue-600 shadow-sm transition-all duration-200 hover:bg-slate-50 hover:translate-y-[-2px] active:scale-95 text-center group">
<span class="material-symbols-outlined text-blue-600 text-[36px] group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">favorite</span>
<h2 class="font-sans font-bold text-sm uppercase tracking-tight text-slate-900 dark:text-white leading-tight">Saúde Fácil</h2>
</button>
<!-- Card 5: Voz do Bairro (New) -->
<button class="flex flex-col items-center justify-center gap-3 bg-white dark:bg-slate-800 rounded-lg p-4 min-h-[140px] w-full border-b-4 border-blue-600 shadow-sm transition-all duration-200 hover:bg-slate-50 hover:translate-y-[-2px] active:scale-95 text-center group">
<span class="material-symbols-outlined text-blue-600 text-[36px] group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">campaign</span>
<h2 class="font-sans font-bold text-sm uppercase tracking-tight text-slate-900 dark:text-white leading-tight">Voz do<br/>Bairro</h2>
</button>
</div>
</main>
<!-- BottomNavBar Component -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md flex justify-around items-center h-16 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-50">
<button class="flex flex-col items-center justify-center text-blue-700 dark:text-blue-400 border-b-4 border-blue-600 pb-1 w-full h-full transition-transform duration-200 active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[11px] font-bold uppercase tracking-tighter">Início</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 pb-1 w-full h-full transition-transform duration-200 active:scale-90 hover:bg-slate-50 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">report_problem</span>
<span class="text-[11px] font-bold uppercase tracking-tighter">Relatar</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 pb-1 w-full h-full transition-transform duration-200 active:scale-90 hover:bg-slate-50 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">how_to_vote</span>
<span class="text-[11px] font-bold uppercase tracking-tighter">Votos</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 pb-1 w-full h-full transition-transform duration-200 active:scale-90 hover:bg-slate-50 dark:hover:bg-slate-800">
<span class="material-symbols-outlined">description</span>
<span class="text-[11px] font-bold uppercase tracking-tighter">Petições</span>
</button>
</nav>
</body></html>
