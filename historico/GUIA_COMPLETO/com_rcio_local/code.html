<style>

    font-family: 'Public Sans', sans-serif;
  }
  .map-dimmed {
    opacity: 0.5;
  }
  /* Civic Guardian "Chunky Card" Style */
  .chunky-card {
    border: 2px solid #E2E8F0;
    box-shadow: 4px 4px 0px 0px #1173d4;
    transition: all 0.2s ease;
  }
  .chunky-card:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px 0px #1173d4;
  }
</style>

</div>

</div>

<button aria-label="Dona Maria Salgados" class="absolute top-1/2 left-2/3 flex flex-col items-center group">

<span class="material-symbols-outlined text-white text-sm" data-icon="storefront">storefront</span>
</div>
</button>
<button aria-label="Borracharia São Jorge" class="absolute bottom-1/4 left-1/4 flex flex-col items-center group">

<div class="flex flex-col items-end shrink-0">
<span class="font-black text-blue-600">600m</span>
</div>

<div class="flex items-center bg-success text-white px-2 py-0.5 rounded-md w-max mt-1">
<span class="material-symbols-outlined text-[14px] mr-1" data-icon="check_circle">check_circle</span>
<span class="text-[10px] font-black tracking-wider uppercase">Comércio Verificado</span>
</div>
</button>

<button class="w-full text-left p-4 bg-white chunky-card rounded-lg flex flex-col gap-2">

<div class="flex-1">

</div>
<div class="flex flex-col items-end shrink-0">
<span class="font-black text-blue-600">850m</span>
</div>
</div>

<span class="text-[11px] font-bold uppercase tracking-tighter">Leis</span>
</button>
