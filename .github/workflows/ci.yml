name: CI — Conecta Santa Maria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type Check + Lint + Tests + Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: conectasantamaria-pa.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: conectasantamaria-pa
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: conectasantamaria-pa.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-CI
      NEXT_PUBLIC_FIREBASE_DATABASE_ID: '(default)'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
